# WTA Hash Configuration
# Winner-Take-All Hashing - bio-inspired competitive selection

experiment_name: "wta_hash_mnist"

# Dataset
dataset: "mnist"
data_root: "./data"

# Encoder configuration
encoder: "wta_hash"
encoder_config:
  input_dim: 784
  n_hashes: 64            # Number of WTA windows
  window_size: 8           # Features per window
  # Output dim = n_hashes * window_size = 512
  # Sparsity = 1 - 1/window_size = 87.5%
  verbose: true

# Binarization (done internally via WTA)
binarization_method: "none"

# Evaluation
eval_clustering: true
eval_retrieval: true
n_clusters: 10

clustering_methods:
  - kmeans

retrieval_k_values: [1, 10, 50, 100]

# Output
output_dir: "./outputs"
save_codes: true
save_model: true
seed: 0
