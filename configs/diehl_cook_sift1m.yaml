# Diehl & Cook (2015) STDP baseline configuration for SIFT-1M dataset
# SIFT-1M: 128-dimensional SIFT descriptors from 1M images

# Experiment settings
experiment_name: "diehl_cook_sift1m"
seed: 0
output_dir: "./outputs"

# Dataset
dataset: "sift1m"
data_root: "./data"

# Encoder
encoder: "diehl_cook"
encoder_config:
  input_dim: 128  # SIFT descriptor dimension
  n_neurons: 400  # Excitatory neurons
  simulation_time: 350  # ms
  dt: 1.0  # ms
  
  # LIF neuron parameters
  thresh: -52.0  # mV
  rest: -65.0  # mV
  refrac: 5  # ms
  
  # STDP parameters
  nu: [1.0e-4, 1.0e-2]  # Learning rates [pre, post]
  
  # Training
  n_train_samples: null  # null = use all training samples
  device: "cuda"  # BindsNET benefits from GPU

# Feature extraction
binarization_method: "top_k_percent"
binarization_params:
  percent: 0.05  # 5% sparsity

# Evaluation
eval_clustering: false  # No labels for SIFT1M
eval_retrieval: true    # Retrieval is the primary task

retrieval_k_values: [1, 10, 50, 100]

# Hardware
device: "cuda"  # BindsNET benefits from GPU

# Logging
verbose: true
save_codes: true
save_model: true

# Notes:
# - SIFT-1M is primarily for retrieval/ANN evaluation
# - Full 1M vectors requires significant memory and training time
# - Consider using n_train_samples to limit training size for testing
