# BioHash Configuration
# Hebbian-learned sparse projection + WTA binarization

experiment_name: "biohash_mnist"

# Dataset
dataset: "mnist"
data_root: "./data"

# Encoder configuration
encoder: "biohash"
encoder_config:
  input_dim: 784
  hash_dim: 256           # Output dimension
  sparse_ratio: 0.1       # Sparse connectivity (10%)
  k_winners: 13           # Top-k winners (~5% of 256)
  n_epochs: 5             # Hebbian learning epochs
  batch_size: 128
  lr: 0.01                # Hebbian learning rate
  verbose: true

# Binarization (done internally via WTA)
binarization_method: "none"

# Evaluation
eval_clustering: true
eval_retrieval: true
n_clusters: 10

clustering_methods:
  - kmeans

retrieval_k_values: [1, 10, 50, 100]

# Output
output_dir: "./outputs"
save_codes: true
save_model: true
seed: 0
