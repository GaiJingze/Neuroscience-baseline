# SoftHebb Configuration
# Paper: "SoftHebb: Bayesian inference in unsupervised Hebbian soft winner-take-all networks"
# Moraitis et al., Neural Computation and Engineering (2022), ICLR (2023)
# Ref: https://github.com/NeuromorphicComputing/SoftHebb

experiment_name: "softhebb_mnist"

# Dataset
dataset: "mnist"  # mnist, fashion_mnist
data_root: "./data"

# Encoder configuration
encoder: "softhebb"
encoder_config:
  input_dim: 784  # 28x28 for MNIST

  # Network architecture
  hidden_dims: [1000, 500]  # Multi-layer: 784 -> 1000 -> 500 -> 400
  output_dim: 400  # Final feature dimension

  # SoftHebb hyperparameters
  # t_invert = inverse temperature (1/τ) for softmax soft-WTA
  # Higher = sharper competition (approaches hard WTA); lower = softer
  t_invert: 5.0       # Typical: 1-10
  eta: 0.01            # Hebbian learning rate (typical: 0.001-0.1)

  # Training parameters
  n_epochs: 10
  batch_size: 128

  # Device
  device: "cuda"

# Evaluation configuration
eval_clustering: true
eval_retrieval: true

# Clustering parameters
n_clusters: 10
clustering_methods: ["kmeans"]

# Retrieval parameters
retrieval_k_values: [1, 10, 50, 100]

# Output
output_dir: "./outputs"
save_codes: true
save_model: true

# Reproducibility
seed: 0
